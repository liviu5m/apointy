server:
  port: 8080

spring:
  application:
    name: gateway
  cloud:
    gateway:
      routes:
        - id: user-service
          uri: http://localhost:8081
          predicates:
            - Path=/user/**, /auth/**
          filters:
            - StripPrefix=0
logging:
  level:
    org.springframework.security: DEBUG
    org.springframework.web: DEBUG
    org.springframework.cloud.gateway: TRACE

security:
  jwt:
    secret-key: ${JWT_SECRET}
    expiration-time: 3600000